# Enable ONLY after obtaining a publicly trusted IP certificate.
# Do not expose service.env, account databases, private keys, or source folders.
server {
    listen 443 ssl;
    server_name 132.226.5.8;
    ssl_certificate /etc/letsencrypt/live/132.226.5.8/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/132.226.5.8/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location ~ ^/(register|login|logout|events|friends|friends/add|friends/remove|search|presence|ice|invite|respond|signal|leave|health)$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        root /var/www/yisi-xiangqi;
        index index.html;
        add_header X-Content-Type-Options nosniff;
    }
}
