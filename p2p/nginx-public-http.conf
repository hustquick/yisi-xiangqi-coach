# Bootstrap only: install after Oracle ingress TCP 80 has been allowed.
# Keep account requests inaccessible over plaintext HTTP.
server {
    listen 80;
    server_name 132.226.5.8;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/yisi-acme;
    }
    location / { return 301 https://132.226.5.8$request_uri; }
}
