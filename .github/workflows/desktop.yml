name: Desktop packages
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'local/**', 'web/app/**', '.github/workflows/desktop.yml']
jobs:
  package:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm --prefix local ci
      - run: npm --prefix local run build
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build
      - uses: actions/upload-artifact@v4
        with:
          name: yisi-xiangqi-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
